# Added for the CheatBreaker fork: builds the mod jar on every push to our branch and pushes it to the
# "ci-output" branch, so it can be fetched with plain git (artifact downloads aren't reachable from
# everywhere). Upstream's own workflows are left as they are.
name: Fork build

on:
  push:
    branches: [ lazy-texture-binds, cheatbreaker ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          mkdir -p build
          ./gradlew --no-daemon --stacktrace build -x test 2>&1 | tee build/build.log
          exit ${PIPESTATUS[0]}

      - name: Publish outputs to the ci-output branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp build/build.log "$out/" || true
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} "$out/" \; 2>/dev/null || true
          echo "build: ${{ steps.build.outcome }} for ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" > "$out/STATUS.txt"
          cd "$out"
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA::7}: build ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
