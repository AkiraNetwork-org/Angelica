# Added for the CheatBreaker fork: GTNHLib (the library Angelica runs on) built with our patches in
# gtnhlib-patches/, published to the "ci-output-gtnhlib" branch like the Angelica jar. The patches are
# applied to the GTNHLib release named below, so the source of the jar is that release plus these files.
name: GTNHLib build (patched)

on:
  push:
    branches: [ cheatbreaker ]
    paths: [ 'gtnhlib-patches/**', '.github/workflows/gtnhlib.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GTNHLIB_TAG: '0.11.54'
  # version of the patched jar: above the release, so mods asking for "0.11.54 or later" accept it
  VERSION: '0.11.54.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Patched GTNHLib source
        run: |
          git clone -q --depth 1 --branch "$GTNHLIB_TAG" https://github.com/GTNewHorizons/GTNHLib.git gtnhlib-src
          cd gtnhlib-src
          for p in ../gtnhlib-patches/*.patch; do echo "applying $p"; git apply "$p"; done
          git -c user.name=ci -c user.email=ci@localhost commit -qam "Akira patches"
          git tag -f "$VERSION"

      - name: Build
        id: build
        continue-on-error: true
        working-directory: gtnhlib-src
        run: |
          mkdir -p build
          ./gradlew --no-daemon --stacktrace assemble 2>&1 | tee build/build.log
          exit ${PIPESTATUS[0]}

      - name: Publish to the ci-output-gtnhlib branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp gtnhlib-src/build/build.log "$out/" || true
          find gtnhlib-src/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} "$out/" \; 2>/dev/null || true
          cp gtnhlib-patches/*.patch "$out/" || true
          echo "build: ${{ steps.build.outcome }} for ${GITHUB_SHA::7}: GTNHLib $GTNHLIB_TAG + patches as $VERSION" > "$out/STATUS.txt"
          cd "$out"
          git init -q -b ci-output-gtnhlib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "GTNHLib $VERSION for ${GITHUB_SHA::7}: build ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output-gtnhlib

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
